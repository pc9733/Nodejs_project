apiVersion: v1
kind: Namespace
metadata:
  name: practice-app-prod-2
  labels:
    environment: production
    project: practice-node-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: practice-node-app-prod-2
  namespace: practice-app-prod-2
  labels:
    app: practice-node-app-prod-2
    environment: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: practice-node-app-prod-2
  template:
    metadata:
      labels:
        app: practice-node-app-prod-2
        environment: production
    spec:
      containers:
      - name: node-app-1
        image: nginx:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: practice-node-app-prod-2
  namespace: practice-app-prod-2
  labels:
    app: practice-node-app-prod-2
    environment: production
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  selector:
    app: practice-node-app-prod-2
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  type: LoadBalancer

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: practice-node-app-prod-2
  namespace: practice-app-prod-2
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    # For HTTPS, add certificate-arn and use: '[{"HTTP":80,"HTTPS":443}]'
    # alb.ingress.kubernetes.io/ssl-policy: "ELBSecurityPolicy-TLS-1-2-2017-01"
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:602202572057:certificate/<cert-id>
    alb.ingress.kubernetes.io/healthcheck-path: "/health"
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
  labels:
    app: practice-node-app-prod-2
    environment: production
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: practice-node-app-prod-2
            port:
              number: 80

