# ClusterSecretStore — works cluster-wide (dev cluster)
# Uses the External Secrets Operator SA (IRSA) in namespace external-secrets.
#
# Apply after ESO is healthy:
#   kubectl apply -f k8s/addons/external-secrets-dev.yaml

---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-parameter-store
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
